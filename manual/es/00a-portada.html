<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SigmaPro · Portada</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../manual.css">
</head>
<body>

<section class="page cover" aria-label="Portada">
  <svg id="cover" viewBox="0 0 850 1100" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-label="Portada de SigmaPro sobre fondo negro con letras griegas tenues y polvo dorado: al centro, el logo, la letra sigma minúscula en oro sobre un cuadro negro con su resplandor; debajo, SigmaPro en letras grandes doradas y la leyenda Professional statistical software; al pie, Luis Ángel Barrera-Guzmán."></svg>
</section>

<script>
/* La portada de SigmaPro: la escena de la pantalla de apertura de la app, quieta, en una hoja carta. Se dibuja en
   gráficos vectoriales (nítida a cualquier tamaño) y siempre igual: el azar tiene semilla. Los colores son los de la
   intro (js/intro.js): fondo #050505, oro #C9A227, oro claro #E6C65C, sombra del oro #8C6D1A y blanco cálido #F5F0E6;
   el logo es el mismo de iconos/sigmapro.svg. */
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('cover');
  const el = (tag, attrs, parent, text) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    (parent || svg).appendChild(n);
    return n;
  };
  const W = 850, H = 1100, CX = W / 2;
  const FONDO = '#050505', FONDO_BORDE = '#0B0B0B', CUADRO = '#111111';
  const ORO = '#C9A227', ORO_CLARO = '#E6C65C', ORO_SOMBRA = '#8C6D1A', BLANCO = '#F5F0E6';
  const SERIF = "Georgia, 'Palatino Linotype', 'Book Antiqua', 'Times New Roman', serif";
  /* azar con semilla: la portada sale igual cada vez */
  let semilla = 20261005;
  const azar = () => { semilla = (semilla * 1103515245 + 12345) % 2147483648; return semilla / 2147483648; };

  /* ---------------------------------------------------------------- degradados */
  const defs = el('defs');
  const radial = (id, paradas, attrs) => {
    const g = el('radialGradient', Object.assign({ id }, attrs || {}), defs);
    paradas.forEach(([o, c, a]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g));
  };
  const lineal = (id, paradas, attrs) => {
    const g = el('linearGradient', Object.assign({ id }, attrs || {}), defs);
    paradas.forEach(([o, c, a]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a == null ? 1 : a }, g));
  };
  radial('fondo', [[0, '#17140d', 1], [0.45, FONDO_BORDE, 1], [1, FONDO, 1]], { cx: 0.5, cy: 0.36, r: 0.75 });
  radial('aura', [[0, ORO, 0.30], [0.35, ORO, 0.12], [1, ORO, 0]]);
  radial('chispa', [[0, BLANCO, 1], [0.45, ORO_CLARO, 0.9], [1, ORO, 0]]);
  lineal('metal', [[0, ORO_SOMBRA], [0.45, ORO], [0.72, ORO_CLARO], [1, ORO]], { x1: 0, y1: 1, x2: 1, y2: 0 });
  lineal('titulo', [[0, ORO_SOMBRA], [0.3, ORO], [0.55, ORO_CLARO], [0.8, ORO], [1, ORO_SOMBRA]], { x1: 0, y1: 0, x2: 1, y2: 0 });
  lineal('regla', [[0, ORO, 0], [0.5, ORO, 1], [1, ORO, 0]], { x1: 0, y1: 0, x2: 1, y2: 0 });
  lineal('cuadro', [[0, '#1a1814'], [1, '#0d0c0a']], { x1: 0, y1: 0, x2: 0, y2: 1 });

  el('rect', { x: 0, y: 0, width: W, height: H, fill: FONDO });
  el('rect', { x: 0, y: 0, width: W, height: H, fill: 'url(#fondo)' });

  /* ---------------------------------------------------------------- la constelación de letras griegas */
  const LETRAS = ['α', 'β', 'γ', 'δ', 'ε', 'ζ', 'η', 'θ', 'κ', 'λ', 'μ', 'ν', 'ξ', 'π', 'ρ', 'τ', 'φ', 'χ', 'ψ', 'ω',
    'Γ', 'Δ', 'Θ', 'Λ', 'Ξ', 'Π', 'Σ', 'Φ', 'Ψ', 'Ω', 'χ²', 'σ²'];
  const BRILLAN = ['σ', 'μ', 'Σ', 'χ²'];
  /* zonas libres: el logo, el nombre y la leyenda, y el pie con el autor */
  const libres = [[255, 205, 595, 545], [95, 575, 755, 790], [190, 930, 660, 1020]];
  const ocupa = (x, y, r) => libres.some(([x0, y0, x1, y1]) => x + r > x0 && x - r < x1 && y + r > y0 && y - r < y1);
  const puestas = [];
  let intentos = 0;
  while (puestas.length < 44 && intentos++ < 4000) {
    const t = 14 + Math.pow(azar(), 2.2) * 96, x = 40 + azar() * (W - 80), y = 50 + azar() * (H - 100), r = t * 0.55;
    if (ocupa(x, y, r) || puestas.some(p => Math.hypot(p.x - x, p.y - y) < (p.r + r) * 1.15)) continue;
    puestas.push({ x, y, r, t });
  }
  const capa = el('g', { 'font-family': SERIF, 'text-anchor': 'middle' });
  puestas.forEach((p, i) => {
    const oro = i % 9 === 4, letra = oro ? BRILLAN[(i / 9 | 0) % BRILLAN.length] : LETRAS[Math.floor(azar() * LETRAS.length)];
    const op = oro ? 0.30 + azar() * 0.18 : 0.05 + (p.t / 110) * 0.08 + azar() * 0.03;
    el('text', { x: p.x.toFixed(1), y: (p.y + p.t * 0.35).toFixed(1), 'font-size': p.t.toFixed(1), fill: oro ? ORO : BLANCO, 'fill-opacity': op.toFixed(3),
      transform: `rotate(${((azar() - 0.5) * 16).toFixed(1)} ${p.x.toFixed(1)} ${p.y.toFixed(1)})` }, capa, letra);
  });

  /* ---------------------------------------------------------------- polvo dorado */
  const polvo = el('g', { fill: ORO_CLARO });
  for (let k = 0; k < 170; k++) {
    const x = 20 + azar() * (W - 40), y = 20 + azar() * (H - 40), r = 0.45 + Math.pow(azar(), 3) * 1.5;
    el('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: r.toFixed(2), 'fill-opacity': (0.18 + azar() * 0.55).toFixed(2) }, polvo);
  }

  /* ---------------------------------------------------------------- el marco: dos filetes de oro */
  el('rect', { x: 26, y: 26, width: W - 52, height: H - 52, fill: 'none', stroke: ORO, 'stroke-opacity': 0.42, 'stroke-width': 1 });
  el('rect', { x: 33, y: 33, width: W - 66, height: H - 66, fill: 'none', stroke: ORO, 'stroke-opacity': 0.18, 'stroke-width': 0.6 });
  [[26, 26], [W - 26, 26], [26, H - 26], [W - 26, H - 26]].forEach(([x, y]) =>
    el('path', { d: `M${x} ${y - 5} L${x + 5} ${y} L${x} ${y + 5} L${x - 5} ${y} Z`, fill: ORO, 'fill-opacity': 0.7 }));

  /* ---------------------------------------------------------------- el logo: la σ dorada sobre el cuadro negro */
  const L = 236, LX = CX - L / 2, LY = 256, s = L / 512;
  el('circle', { cx: CX, cy: LY + L / 2, r: L * 1.05, fill: 'url(#aura)' });
  const logo = el('g', { transform: `translate(${LX} ${LY}) scale(${s})` });
  el('rect', { width: 512, height: 512, rx: 112, fill: 'url(#cuadro)' }, logo);
  el('rect', { x: 3, y: 3, width: 506, height: 506, rx: 110, fill: 'none', stroke: ORO, 'stroke-opacity': 0.28, 'stroke-width': 4 }, logo);
  el('text', { x: 256, y: 372, 'font-family': "Georgia, 'Times New Roman', serif", 'font-size': 560, 'text-anchor': 'middle', fill: 'url(#metal)' }, logo, 'σ');
  /* destellos de cuatro puntas sobre la σ (los de la intro, en las coordenadas del logo de 512) */
  const chispa = r => { const k = (r * 0.14).toFixed(1); return `M0 ${-r}C${k} ${-k} ${k} ${-k} ${r} 0C${k} ${k} ${k} ${k} 0 ${r}C${-k} ${k} ${-k} ${k} ${-r} 0C${-k} ${-k} ${-k} ${-k} 0 ${-r}Z`; };
  [[404, 116, 46], [124, 236, 34], [262, 384, 22]].forEach(([x, y, r]) => el('path', { d: chispa(r), fill: 'url(#chispa)', transform: `translate(${x} ${y})` }, logo));

  /* ---------------------------------------------------------------- el nombre y la leyenda */
  el('text', { x: CX, y: 668, 'text-anchor': 'middle', 'font-family': SERIF, 'font-size': 108, style: 'font-variant: small-caps',
    'letter-spacing': 6, textLength: 600, lengthAdjust: 'spacing', fill: 'url(#titulo)' }, null, 'SigmaPro');
  /* filete con un rombo al centro */
  el('rect', { x: CX - 210, y: 700, width: 180, height: 1, fill: 'url(#regla)' });
  el('rect', { x: CX + 30, y: 700, width: 180, height: 1, fill: 'url(#regla)' });
  el('path', { d: `M${CX} ${694} L${CX + 6} ${700.5} L${CX} ${707} L${CX - 6} ${700.5} Z`, fill: ORO });
  el('text', { x: CX, y: 752, 'text-anchor': 'middle', 'font-family': SERIF, 'font-size': 26, 'letter-spacing': 3.2, fill: BLANCO, 'fill-opacity': 0.88 }, null, 'Professional statistical software');

  /* ---------------------------------------------------------------- el autor */
  el('rect', { x: CX - 36, y: 944, width: 72, height: 1, fill: 'url(#regla)' });
  el('text', { x: CX, y: 984, 'text-anchor': 'middle', 'font-family': SERIF, 'font-size': 22, 'letter-spacing': 2.4, fill: BLANCO, 'fill-opacity': 0.9 }, null, 'Luis Ángel Barrera-Guzmán');
})();
</script>
</body>
</html>
