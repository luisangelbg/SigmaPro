<html lang="es"><head><meta charset="utf-8"><title>SigmaPro · tarjeta</title>
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fbf8f2;font-family:system-ui,sans-serif}
.card{position:relative;width:1200px;height:630px;overflow:hidden;

.brand{display:flex;align-items:center;gap:22px;font-size:22px;letter-spacing:.32em;color:#5c4a22;font-weight:500}

p{margin:30px 0 0;font-size:31px;line-height:1.38;color:#4a4339;max-width:520px}
.rule{position:absolute;left:70px;top:528px;width:56px;height:4px;border-radius:2px;background:#c9a24a}
.url{position:absolute;left:70px;top:546px;font-size:26px;color:#2d2924}
